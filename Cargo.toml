[package]
name = "path-walker"
version = "0.2.0"
edition = "2021"
description = "Project find_mems hits onto GFA paths as per-node coverage (MEM-Projection)"
authors = ["Erik Garrison <erik.garrison@gmail.com>", "Andrea Guarracino <aguarra1@uthsc.edu>", "Hari Lakshmidevi"]

[dependencies]
clap = { version = "4.5.40", features = ["derive"] }
flate2 = "1.1.2"
bytemuck = { version = "1", features = ["derive", "extern_crate_alloc"] }
rayon = "1.10"
